<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>YZ Voice Room</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="room-page">

    <!-- =========================
         TOP BAR
    ========================= -->

    <nav class="room-topbar">

        <div class="room-top-left">

            <button
                class="room-back-btn"
                type="button"
                onclick="goBack()"
            >
                ← 返回大厅
            </button>

        </div>


        <div class="room-top-center">

            <h2 id="room-title">
                语音房
            </h2>

            <div id="room-online">
                👥 0 人在线
            </div>

        </div>


        <div class="room-top-right">

            <button
                id="delete-room-button"
                class="delete-room-btn hidden"
                type="button"
            >
                删除房间
            </button>

            <button
                class="room-leave-btn"
                type="button"
                onclick="goBack()"
            >
                离开房间
            </button>

        </div>

    </nav>



    <!-- =========================
         ROOM
    ========================= -->

    <main
        class="room-layout"
        id="room-root"
    >


        <!-- =====================
             VOICE STAGE
        ====================== -->

        <section class="voice-stage">


            <!-- HOST -->

            <div class="room-host-box">

                <img
                    id="host-avatar"
                    src=""
                    alt="房主头像"
                >


                <div class="room-host-text">

                    <small>
                        房主
                    </small>

                    <strong id="room-host">
                        -
                    </strong>

                </div>

            </div>



            <!-- =====================
                 SEATS
            ====================== -->

            <div class="seat-grid">


                <div
                    class="voice-seat empty-seat"
                    data-seat="1"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(1)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-1"
                    >
                        1号麦
                    </span>

                </div>



                <div
                    class="voice-seat empty-seat"
                    data-seat="2"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(2)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-2"
                    >
                        2号麦
                    </span>

                </div>



                <div
                    class="voice-seat empty-seat"
                    data-seat="3"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(3)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-3"
                    >
                        3号麦
                    </span>

                </div>



                <div
                    class="voice-seat empty-seat"
                    data-seat="4"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(4)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-4"
                    >
                        4号麦
                    </span>

                </div>



                <div
                    class="voice-seat empty-seat"
                    data-seat="5"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(5)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-5"
                    >
                        5号麦
                    </span>

                </div>



                <div
                    class="voice-seat empty-seat"
                    data-seat="6"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(6)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-6"
                    >
                        6号麦
                    </span>

                </div>



                <div
                    class="voice-seat empty-seat"
                    data-seat="7"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(7)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-7"
                    >
                        7号麦
                    </span>

                </div>



                <!-- BOSS SEAT -->

                <div
                    class="voice-seat empty-seat boss-seat"
                    data-seat="8"
                >

                    <div
                        class="seat-avatar"
                        onclick="toggleSeat(8)"
                    >
                        +
                    </div>

                    <span
                        class="seat-name"
                        id="seat-name-8"
                    >
                        老板位
                    </span>

                </div>


            </div>



            <!-- =====================
                 CONTROLS
            ====================== -->

            <div class="room-controls">


                <!-- MICROPHONE -->

                <button
                    class="control-button"
                    id="mic-button"
                    type="button"
                    onclick="toggleMicrophone()"
                >

                    <span
                        class="control-icon"
                        id="mic-icon"
                    >
                        🎤
                    </span>

                    <span
                        class="control-label"
                        id="mic-text"
                    >
                        麦克风
                    </span>

                </button>



                <!-- SPEAKER -->

                <button
                    class="control-button"
                    id="speaker-button"
                    type="button"
                >

                    <span class="control-icon">
                        🔊
                    </span>

                    <span class="control-label">
                        扬声器
                    </span>

                </button>



                <!-- GIFT -->

                <button
                    class="control-button"
                    id="gift-button"
                    type="button"
                >

                    <span class="control-icon">
                        🎁
                    </span>

                    <span class="control-label">
                        礼物
                    </span>

                </button>


            </div>



            <!-- =====================
                 VOLUME
            ====================== -->

            <div class="volume-panel">

                <div class="volume-row">

                    <span>
                        🎙️ 麦克风
                    </span>

                    <input
                        id="mic-volume"
                        type="range"
                        min="0"
                        max="200"
                        value="100"
                    >

                    <small id="mic-volume-value">
                        100%
                    </small>

                </div>


                <div class="volume-row">

                    <span>
                        🔊 扬声器
                    </span>

                    <input
                        id="speaker-volume"
                        type="range"
                        min="0"
                        max="100"
                        value="100"
                    >

                    <small id="speaker-volume-value">
                        100%
                    </small>

                </div>

            </div>


        </section>



        <!-- =====================
             CHAT
        ====================== -->

        <aside class="chat-panel">


            <div class="chat-header">

                <h3>
                    💬 房间聊天
                </h3>

            </div>



            <div
                class="chat-messages"
                id="chat-messages"
            >

                <div class="chat-message">

                    <strong>
                        系统
                    </strong>

                    <p>
                        欢迎进入语音房
                    </p>

                </div>

            </div>



            <div class="chat-input-area">

                <input
                    id="chat-input"
                    maxlength="200"
                    autocomplete="off"
                    placeholder="说点什么..."
                >

                <button
                    id="chat-send-button"
                    type="button"
                >
                    发送
                </button>

            </div>


        </aside>


    </main>



    <!-- =========================
         GIFT MODAL
    ========================= -->

    <div
        id="gift-modal"
        class="gift-modal hidden"
    >

        <div class="gift-modal-content">


            <div class="gift-modal-header">

                <div>

                    <h3>
                        🎁 选择礼物
                    </h3>

                    <small>
                        请选择已经上麦的用户
                    </small>

                </div>


                <button
                    id="gift-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div
                id="gift-grid"
                class="gift-grid"
            >
            </div>


        </div>

    </div>



    <!-- =========================
         GIFT ANIMATION
    ========================= -->

    <div
        id="gift-animation-layer"
        class="gift-animation-layer"
    >
    </div>



    <!-- =========================
         LIVEKIT
    ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"
    ></script>


    <!-- =========================
         ROOM JS
    ========================= -->

    <script
        type="module"
        src="room.js"
    ></script>


</body>

</html>
