<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完成资料</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><h1>完成注册资料</h1><input id="nickname" placeholder="唯一昵称"><select id="gender"><option value="">性别（以后不能改）</option><option value="male">男</option><option value="female">女</option><option value="other">其他</option></select><div class="birthday-grid"><input id="month" type="number" placeholder="月"><input id="day" type="number" placeholder="日"><input id="year" type="number" placeholder="年份（不公开）"></div><label class="terms-check"><input id="terms" type="checkbox"> 同意条款</label><button id="finish" class="primary-action">完成</button><p id="status"></p></section></main><script type="module" src="onboarding.js"></script></body></html>
