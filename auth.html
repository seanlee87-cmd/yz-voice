<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YZ Voice 注册/登录</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><h1>YZ VOICE</h1><div class="auth-tabs"><button id="tab-login" class="active">登录</button><button id="tab-register">注册</button></div><section id="login-panel"><button id="google-login" class="social-login">G Google 一键登录</button><a href="/api/auth/wechat-start" class="social-login wechat-login">💬 微信一键登录</a><div class="splitter">或</div><input id="login-id" placeholder="8位用户ID"><input id="login-password" type="password" placeholder="密码"><label class="terms-check"><input id="login-terms" type="checkbox"> 我同意 <a href="terms.html" target="_blank">用户条款</a></label><button id="id-login" class="primary-action">登录</button></section><section id="register-panel" hidden><input id="reg-email" type="email" placeholder="Email"><input id="reg-password" type="password" placeholder="密码（至少8位，含字母+数字）"><input id="reg-nickname" maxlength="20" placeholder="唯一昵称"><select id="reg-gender"><option value="">选择性别（以后不能改）</option><option value="male">男</option><option value="female">女</option><option value="other">其他</option></select><div class="birthday-grid"><input id="reg-month" type="number" min="1" max="12" placeholder="月"><input id="reg-day" type="number" min="1" max="31" placeholder="日"><input id="reg-year" type="number" min="1900" placeholder="年份（不公开）"></div><label class="terms-check"><input id="reg-terms" type="checkbox"> 我同意 <a href="terms.html" target="_blank">用户条款</a></label><button id="email-register" class="primary-action">Email 注册</button><button id="google-register" class="social-login">G 使用 Google 注册</button><a href="/api/auth/wechat-start" class="social-login wechat-login">💬 使用微信注册</a></section><p id="auth-status"></p></section></main><script type="module" src="auth.js"></script></body></html>
