<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料</title><link rel="stylesheet" href="style.css"></head><body><main class="profile-page"><section class="profile-card"><img id="avatar" class="profile-avatar"><input id="avatar-file" type="file" accept="image/*" hidden><button id="change-avatar">更换头像</button><h1 id="nickname">-</h1><div class="profile-fields"><div><span>ID</span><strong id="public-id">-</strong></div><div><span>生日</span><strong id="birthday">-</strong></div><div><span>性别</span><strong id="gender">-</strong></div></div><div class="wallet-grid"><div class="wallet-box"><span>金币</span><strong id="coins">0</strong></div><div class="wallet-box"><span>钻石</span><strong id="diamonds">0</strong></div></div><input id="new-nickname" placeholder="修改昵称"><button id="save-nickname">保存昵称</button><input id="withdraw-amount" type="number" placeholder="提现钻石"><button id="withdraw">提交提现申请</button><button id="logout">退出登录</button><p id="status"></p></section></main><script type="module" src="profile.js"></script></body></html>
